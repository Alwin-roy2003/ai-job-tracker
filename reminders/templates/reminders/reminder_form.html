<!DOCTYPE html>
<html>
<head>
    <title>Add Reminder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.10);
            padding: 26px 24px;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 18px;
            font-size: 28px;
            color: #111827;
            text-align: center;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            display: inline-block;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            transition: 0.2s ease;
            font-size: 14px;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0px);
        }

        .back-btn {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 11px 14px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            background: #e5e7eb;
            color: #111827;
            transition: 0.2s ease;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #d1d5db;
            transform: translateY(-1px);
        }

        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1>Add Reminder</h1>

            <form method="post">
                {% csrf_token %}

                <div class="field">
                    <label>Title</label>
                    <input type="text" name="title" required placeholder="Enter reminder title">
                    <div class="hint">Example: Follow up email / Interview reminder</div>
                </div>

                <div class="field">
                    <label>Application</label>
                    <select name="application" required>
                        {% for app in applications %}
                            <option value="{{ app.id }}">{{ app.title }}</option>
                        {% endfor %}
                    </select>
                    <div class="hint">Choose the job application for this reminder</div>
                </div>

                <div class="field">
                    <label>Reminder Date</label>
                    <input type="date" name="reminder_date">
                    <div class="hint">Optional: select a date to get reminded</div>
                </div>

                <div class="buttons">
                    <button type="submit">Save</button>
                    <a class="back-btn" href="{% url 'reminder_list' %}">Back</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
